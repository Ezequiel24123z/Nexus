name: Desktop CI & Portable Release

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.node-version'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist:portable
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable-Windows
          path: desktop/release/NEXUS-Portable.exe
      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release/NEXUS-Portable.exe --clobber || gh release create "${{ github.ref_name }}" release/NEXUS-Portable.exe --title "NEXUS ${{ github.ref_name }}" --generate-notes
